##############################################################
#  Xendrx — Nginx Configuration
#  Place this file at: /etc/nginx/sites-available/xendrx
#  Then: ln -s /etc/nginx/sites-available/xendrx /etc/nginx/sites-enabled/
#  Test:  nginx -t
#  Apply: systemctl reload nginx
##############################################################

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect all HTTP → HTTPS (after you set up SSL with Certbot)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # --- SSL (managed by Certbot) ---
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Serve React frontend (SPA) ---
    root /var/www/xendrx/public;
    index index.html;

    # --- Uploaded files (KYC docs, etc.) ---
    location /uploads/ {
        alias /var/www/xendrx/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # --- Proxy all /api/* requests to the Node.js API server ---
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Required for SSE (Server-Sent Events) real-time chat
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- SSE endpoint (real-time updates for chat & orders) ---
    location /api/sse/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # --- React SPA fallback (all unmatched routes → index.html) ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Cache static assets ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
